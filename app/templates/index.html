<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeadSweep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark"><i data-lucide="radar"></i></span>
          <span>
            <strong>LeadSweep</strong>
            <small>Maps lead scraper</small>
          </span>
        </a>

        <nav class="top-actions" aria-label="Quick actions">
          <a class="icon-button" href="/latest-results" title="Latest results">
            <i data-lucide="table-2"></i>
          </a>
          <form method="POST" action="/clear-history">
            <button class="icon-button danger" type="submit" title="Clear history">
              <i data-lucide="trash-2"></i>
            </button>
          </form>
        </nav>
      </header>

      <section class="workspace">
        <div class="control-surface">
          <div class="surface-head">
            <p class="eyebrow">Search setup</p>
            <h1>Find local business contacts</h1>
          </div>

          {% with messages = get_flashed_messages() %}
          {% if messages %}
          <div class="notice">
            <i data-lucide="circle-alert"></i>
            <div>
              {% for message in messages %}
              <p>{{ message }}</p>
              {% endfor %}
            </div>
          </div>
          {% endif %}
          {% endwith %}

          <form class="scrape-form" method="POST" data-scrape-form>
            <label class="field">
              <span>Category</span>
              <div class="input-wrap">
                <i data-lucide="search"></i>
                <input
                  type="text"
                  autocomplete="off"
                  name="keyword"
                  placeholder="dentist, clothing store, salon"
                  required
                />
              </div>
            </label>

            <label class="field">
              <span>City</span>
              <div class="input-wrap">
                <i data-lucide="map-pin"></i>
                <input
                  type="text"
                  autocomplete="off"
                  name="city"
                  placeholder="Indore"
                  required
                />
              </div>
            </label>

            <label class="field" data-area-field>
              <span>Specific area</span>
              <div class="input-wrap">
                <i data-lucide="navigation"></i>
                <input
                  type="text"
                  autocomplete="off"
                  name="district"
                  placeholder="Vijay Nagar"
                />
              </div>
            </label>

            <div class="switch-grid">
              <label class="switch-card">
                <input type="checkbox" name="scrape_full_city" id="scrape_full_city" />
                <span class="switch-visual"><i data-lucide="scan-search"></i></span>
                <span>
                  <strong>Full city</strong>
                  <small>Auto grid coverage</small>
                </span>
              </label>

              <label class="switch-card">
                <input
                  type="checkbox"
                  name="scrape_all_available"
                  id="scrape_all_available"
                />
                <span class="switch-visual"><i data-lucide="infinity"></i></span>
                <span>
                  <strong>Maximum</strong>
                  <small>Use limit as cap</small>
                </span>
              </label>
            </div>

            <div class="split-fields">
              <label class="field">
                <span>Coverage</span>
                <div class="select-wrap">
                  <i data-lucide="layers-3"></i>
                  <select name="coverage_depth">
                    <option value="fast" selected>Fast coverage</option>
                    <option value="deep">Deep coverage</option>
                  </select>
                </div>
              </label>

              <label class="field">
                <span>Result limit</span>
                <div class="input-wrap">
                  <i data-lucide="gauge"></i>
                  <input
                    type="number"
                    autocomplete="off"
                    name="qtn"
                    placeholder="300"
                    min="1"
                    required
                  />
                </div>
              </label>
            </div>

            <button class="primary-action" type="submit" data-submit-button>
              <i data-lucide="play"></i>
              <span>Start scraping</span>
            </button>
          </form>
        </div>

        <aside class="status-panel">
          <div class="metric-row">
            <span><i data-lucide="sparkles"></i> Category expansion</span>
            <strong>Auto</strong>
          </div>
          <div class="metric-row">
            <span><i data-lucide="route"></i> City coverage</span>
            <strong>Grid</strong>
          </div>
          <div class="metric-row">
            <span><i data-lucide="shield-check"></i> Dedupe</span>
            <strong>On</strong>
          </div>
          <div class="run-state" data-run-state>
            <i data-lucide="activity"></i>
            <span>Ready</span>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
